<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🛡️ Spam Detector Pro</title>
  <style>
    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-20px); }
      60% { transform: translateY(-10px); }
    }
    
    @keyframes glow {
      0%, 100% { box-shadow: 0 0 20px rgba(255,255,255,0.3); }
      50% { box-shadow: 0 0 40px rgba(255,255,255,0.8); }
    }

    * { box-sizing: border-box; }
    
    body {
      font-family: 'Segoe UI', -apple-system, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: linear-gradient(-45deg, #667eea, #764ba2, #f093fb, #f5576c);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      padding: 40px;
      max-width: 800px;
      width: 100%;
      box-shadow: 0 25px 45px rgba(0,0,0,0.2);
      border: 1px solid rgba(255,255,255,0.2);
      position: relative;
      overflow: hidden;
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
      position: relative;
    }

    h1 {
      font-size: 2.5em;
      margin: 0;
      background: linear-gradient(45deg, #fff, #ffeaa7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 0 30px rgba(255,255,255,0.5);
    }

    .dude {
      position: absolute;
      right: 20px;
      top: 20px;
      font-size: 4em;
      animation: bounce 2s infinite;
    }

    textarea {
      width: 100%;
      height: 120px;
      padding: 20px;
      border: none;
      border-radius: 20px;
      font-size: 18px;
      background: rgba(255,255,255,0.9);
      color: #333;
      resize: vertical;
      margin-bottom: 20px;
      transition: all 0.3s ease;
      box-shadow: 0 8px 25px rgba(0,0,0,0.1);
    }

    textarea:focus {
      outline: none;
      transform: translateY(-2px);
      box-shadow: 0 15px 35px rgba(0,0,0,0.2);
    }

    textarea:disabled {
      background: #ddd;
      cursor: not-allowed;
    }

    button {
      width: 100%;
      padding: 20px;
      font-size: 20px;
      font-weight: bold;
      background: linear-gradient(45deg, #ff6b6b, #ff8e8e);
      color: white;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 10px 30px rgba(255,107,107,0.4);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    button:hover:not(:disabled) {
      transform: translateY(-3px);
      box-shadow: 0 15px 40px rgba(255,107,107,0.6);
    }

    button:disabled {
      background: #666;
      cursor: not-allowed;
      transform: none;
    }

    .status {
      text-align: center;
      font-size: 18px;
      font-style: italic;
      margin: 20px 0;
      color: #ffeaa7;
      min-height: 25px;
      padding: 15px;
      background: rgba(255,255,255,0.1);
      border-radius: 10px;
    }

    .debug {
      background: rgba(255,0,0,0.2);
      border: 1px solid #ff4444;
      color: #ffeeee;
    }

    .output {
      margin-top: 30px;
      padding: 30px;
      background: rgba(255,255,255,0.1);
      border-radius: 20px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.2);
    }

    .section {
      margin-bottom: 25px;
    }

    .section h3 {
      margin: 0 0 15px 0;
      color: #ffeaa7;
      font-size: 1.3em;
    }

    pre {
      background: rgba(0,0,0,0.3);
      padding: 20px;
      border-radius: 15px;
      font-size: 14px;
      white-space: pre-wrap;
      max-height: 200px;
      overflow-y: auto;
      color: #e8e8e8;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .result-box {
      font-size: 28px;
      font-weight: bold;
      text-align: center;
      padding: 30px;
      border-radius: 20px;
      animation: glow 2s infinite;
      margin: 20px 0;
    }

    .spam { 
      background: rgba(255,107,107,0.8); 
      color: white;
      border: 3px solid #ff6b6b;
    }

    .ham { 
      background: rgba(46,204,113,0.8); 
      color: white;
      border: 3px solid #27ae60;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🛡️ Spam Detector Pro</h1>
      <div class="dude">🤖</div>
    </div>
    
    <textarea id="inputText" placeholder="Skriv en engelsk mening här..." disabled></textarea>
    <button id="predictBtn" disabled>🔮 Analysera text</button>
    
    <div id="status" class="status">🚀 Startar upp Spam Detector...</div>
    
    <div id="output" style="display: none;">
      <div class="section">
        <h3>📝 Tokens (från vocabulary):</h3>
        <pre id="tokens"></pre>
      </div>
      
      <div class="section">
        <h3>🎯 AI Analys:</h3>
        <div id="probability" class="result-box">-</div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>
  <script>
    let model = null;
    let metadata = null;
    const MAX_LENGTH = 30;

    // STEG-FÖR-STEG laddning med DEBUG-info
    async function loadModel() {
      const status = document.getElementById('status');
      
      try {
        status.textContent = '📥 Laddar TensorFlow.js...';
        status.classList.remove('debug');
        
        // Vänta på TF.js
        await tf.ready();
        status.textContent = '✅ TensorFlow.js redo. Laddar modell...';
        
        // TESTA om modell-filen finns
        status.textContent = '🔍 Kollar om tfjs_model/model.json finns...';
        try {
          const response = await fetch('tfjs_model/model.json');
          if (!response.ok) {
            throw new Error(`404: Hittar inte model.json (status: ${response.status})`);
          }
          status.textContent = '✅ model.json hittad!';
        } catch (e) {
          status.innerHTML = `❌ <strong>KAN INTE HITTA MODELLEN!</strong><br>` +
            `Filen <code>tfjs_model/model.json</code> saknas eller är fel.<br>` +
            `<br><strong>Kontrollera:</strong><br>` +
            `• Finns mappen <code>tfjs_model/</code> i samma mapp som index.html?<br>` +
            `• Finns <code>model.json</code> i den mappen?<br>` +
            `• Finns alla <code>.bin</code>-filer?<br>` +
            `<br><small>Klicka F12 → Console för mer info</small>`;
          status.classList.add('debug');
          return;
        }
        
        // Ladda metadata först
        status.textContent = '📄 Laddar metadata.json...';
        const metadataResponse = await fetch('tfjs_model/metadata.json');
        if (!metadataResponse.ok) {
          throw new Error(`metadata.json saknas (status: ${metadataResponse.status})`);
        }
        metadata = await metadataResponse.json();
        status.textContent = '✅ Metadata laddad!';
        
        // Ladda själva modellen
        status.textContent = '🧠 Laddar AI-modellen... (kan ta 10-30 sek)';
        model = await tf.loadLayersModel('tfjs_model/model.json');
        status.textContent = '🎉 SPAM DETECTOR REDO!';
        
        // Aktivera input och knapp
        document.getElementById('inputText').disabled = false;
        document.getElementById('predictBtn').disabled = false;
        
      } catch (error) {
        console.error('FULL ERROR:', error);
        status.innerHTML = `❌ FEL: ${error.message}<br>` +
          `<small>Klicka F12 → Console för detaljer. Kontrollera modellkonverteringen!</small>`;
        status.classList.add('debug');
      }
    }

    function tokenize(text) {
      if (!metadata || !metadata.word_index) {
        throw new Error('Vocabulary saknas i metadata.json');
      }
      
      const words = text.toLowerCase().trim().split(/\s+/).filter(w => w.length > 0);
      const wordIndex = metadata.word_index;
      
      let tokens = words.map(word => wordIndex[word] || 0);
      
      while (tokens.length < MAX_LENGTH) {
        tokens.push(0);
      }
      if (tokens.length > MAX_LENGTH) {
        tokens = tokens.slice(0, MAX_LENGTH);
      }
      
      return { words, tokens };
    }

    function getVerdict(probability) {
      const percent = probability * 100;
      if (percent > 50) {
        return {
          text: `🚨 TROLIGEN SPAM (${percent.toFixed(1)}%)`,
          class: 'spam'
        };
      } else {
        return {
          text: `✅ INTE SPAM (${percent.toFixed(1)}%)`,
          class: 'ham'
        };
      }
    }

    async function predictText() {
      const inputText = document.getElementById('inputText').value.trim();
      if (!inputText) {
        alert('Skriv en engelsk mening först!');
        return;
      }

      const btn = document.getElementById('predictBtn');
      btn.disabled = true;
      btn.textContent = '🤖 Analyserar...';
      
      const status = document.getElementById('status');
      status.textContent = '🤖 AI analyserar...';

      try {
        const { words, tokens } = tokenize(inputText);
        const inputTensor = tf.tensor2d([tokens], [1, MAX_LENGTH]);
        
        const prediction = model.predict(inputTensor);
        const scores = await prediction.data();
        
        tf.dispose([inputTensor, prediction]);
        
        const verdict = getVerdict(scores[0]);
        
        document.getElementById('tokens').textContent = 
          `Ord (${words.length}): ${JSON.stringify(words, null, 2)}\n\n` +
          `Token IDs (${tokens.length}): ${tokens.slice(0, 15).join(', ')}${tokens.length > 15 ? '...' : ''}`;
        
        const resultBox = document.getElementById('probability');
        resultBox.textContent = verdict.text;
        resultBox.className = `result-box ${verdict.class}`;

        document.getElementById('output').style.display = 'block';
        status.textContent = '✅ Ny analys klar!';
        
      } catch (error) {
        console.error('Prediktionsfel:', error);
        status.textContent = '❌ Analysfel: ' + error.message;
      } finally {
        btn.disabled = false;
        btn.textContent = '🔮 Analysera text';
      }
    }

    // Event listeners
    document.addEventListener('DOMContentLoaded', function() {
      document.getElementById('predictBtn').addEventListener('click', predictText);
      document.getElementById('inputText').addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && e.ctrlKey) predictText();
      });
      
      // Starta laddning
      setTimeout(loadModel, 100); // Liten fördröjning för att säkerställa DOM
    });
  </script>
</body>
</html>
