<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TF.js Text Modell Tester</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 30px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }
    h1 { text-align: center; margin-bottom: 30px; }
    textarea {
      width: 100%;
      height: 100px;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      box-sizing: border-box;
      background: rgba(255,255,255,0.95);
      margin-bottom: 20px;
    }
    button {
      width: 100%;
      padding: 15px;
      font-size: 18px;
      background: #ff6b6b;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover { background: #ff5252; }
    button:disabled { background: #666; cursor: not-allowed; }
    #output {
      margin-top: 30px;
      padding: 25px;
      background: rgba(255,255,255,0.1);
      border-radius: 12px;
      backdrop-filter: blur(10px);
    }
    .section {
      margin-bottom: 20px;
    }
    .section h3 {
      margin: 0 0 10px 0;
      color: #ffeaa7;
    }
    pre {
      background: rgba(0,0,0,0.3);
      padding: 15px;
      border-radius: 8px;
      font-size: 14px;
      white-space: pre-wrap;
      max-height: 200px;
      overflow-y: auto;
    }
    .probability {
      font-size: 24px;
      font-weight: bold;
      text-align: center;
      padding: 20px;
      background: rgba(255,255,255,0.2);
      border-radius: 12px;
    }
    .loading {
      text-align: center;
      font-style: italic;
      color: #ffeaa7;
    }
  </style>
</head>
<body>
  <h1>🧠 TensorFlow.js Text Modell Tester</h1>
  
  <textarea id="inputText" placeholder="Skriv en engelsk mening här... t.ex. 'The quick brown fox jumps over the lazy dog'"></textarea>
  <button id="predictBtn">🔮 Testa Mening</button>

  <div id="status" class="loading">Laddar modell...</div>
  <div id="output" style="display: none;">
    <div class="section">
      <h3>📝 Tokens (från vocabulary):</h3>
      <pre id="tokens"></pre>
    </div>
    
    <div class="section">
      <h3>🎯 Sannolikhet:</h3>
      <div id="probability" class="probability">-</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>
  <script>
    let model = null;
    let metadata = null;
    const MAX_LENGTH = 30; // Din modell kräver 30 tokens

    // Ladda modell och metadata
    async function loadModel() {
      try {
        document.getElementById('status').textContent = 'Laddar modell från tfjs_model/...';
        
        model = await tf.loadLayersModel('tfjs_model/model.json');
        const metadataResponse = await fetch('tfjs_model/metadata.json');
        metadata = await metadataResponse.json();
        
        document.getElementById('status').textContent = '✅ Modell laddad! Skriv en mening och testa.';
        document.getElementById('predictBtn').disabled = false;
        
      } catch (error) {
        document.getElementById('status').innerHTML = 
          '❌ Fel vid modell-laddning: ' + error.message + 
          '<br><small>Kontrollera att tfjs_model-mappen finns med alla filer</small>';
      }
    }

    // *** FIXAD TOKENISERING ***
    function tokenize(text) {
      if (!metadata || !metadata.word_index) {
        throw new Error('Vocabulary saknas i metadata.json');
      }
      
      // Dela upp i ord
      const words = text.toLowerCase().trim().split(/\s+/).filter(w => w.length > 0);
      const wordIndex = metadata.word_index;
      
      // Konvertera till tokens (0 för okända ord)
      let tokens = words.map(word => wordIndex[word] || 0);
      
      // *** VIKTIG FIX: Padding till exakt 30 tokens ***
      while (tokens.length < MAX_LENGTH) {
        tokens.push(0); // Padding med 0:or
      }
      
      // Klipp av om för långt
      if (tokens.length > MAX_LENGTH) {
        tokens = tokens.slice(0, MAX_LENGTH);
      }
      
      return { words, tokens };
    }

    // Kör prediktion
    async function predictText() {
      const inputText = document.getElementById('inputText').value.trim();
      if (!inputText) {
        alert('Skriv en engelsk mening först!');
        return;
      }

      if (!model) {
        alert('Modellen är inte laddad än!');
        return;
      }

      try {
        document.getElementById('predictBtn').disabled = true;
        document.getElementById('status').textContent = 'Kör prediktion...';

        // Tokenisera med padding
        const { words, tokens } = tokenize(inputText);
        
        // Skapa tensor med rätt shape: [1, 30]
        const inputTensor = tf.tensor2d([tokens], [1, MAX_LENGTH]);
        
        // Kör prediktion
        const prediction = model.predict(inputTensor);
        const scores = await prediction.data();
        tf.dispose([inputTensor, prediction]);
        
        // Visa resultat
        document.getElementById('tokens').textContent = 
          `Original ord: ${JSON.stringify(words, null, 2)}\n\n` +
          `Token IDs (30 tokens): ${JSON.stringify(tokens.slice(0, 15), null, 2)}...\n` +
          `(totalt ${tokens.length} tokens med padding)`;
        
        document.getElementById('probability').textContent = 
          (scores[0] * 100).toFixed(1) + '%';

        document.getElementById('output').style.display = 'block';
        document.getElementById('status').textContent = '✅ Klar!';
        
      } catch (error) {
        document.getElementById('status').textContent = '❌ Prediktionsfel: ' + error.message;
      } finally {
        document.getElementById('predictBtn').disabled = false;
      }
    }

    // Event listeners
    document.getElementById('predictBtn').addEventListener('click', predictText);
    document.getElementById('inputText').addEventListener('keypress', (e) => {
      if (e.key === 'Enter' && e.ctrlKey) predictText();
    });

    loadModel();
  </script>
</body>
</html>
